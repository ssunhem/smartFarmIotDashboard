# telegraf.conf
# ------------------------------------------------------------------------------
# 1. GLOBAL TAGS - Useful for identifying the source of this Telegraf instance
# ------------------------------------------------------------------------------
[agent]
  quiet = false
  interval = "10s"
[global_tags]
  deployment = "smartfarm-stack"

# ------------------------------------------------------------------------------
# 2. OUTPUT PLUGIN - Configure InfluxDB v2
# ------------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-secret-token" # Must match token used by InfluxDB service
  organization = "smartfarm_org"
  bucket = "sensor_data"

# ------------------------------------------------------------------------------
# 3. INPUT PLUGIN - MQTT Consumer (Subscriber)
# ------------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "farm/sensor", # Subscribes to all sensor data topics
    "farm/status"
  ]
  data_format = "influx"

  # [[inputs.mqtt_consumer.topic_parsing]]
  #   topic = "farm/telemetry/+farm_id/+device_id"
  #   tags = "farm_id,device_id"

  # Example JSON payload from a sensor device:
  # {"value": 24.5, "unit": "C"}
  # We use the JSON parser to extract 'value' and define the measurement name.
  
  # For sensor data (temp, humid, soil_moisture):
